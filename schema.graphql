"""
Descriptive data for a physical location. May be used as an actual physical address (place to which one could go), or as a container of "address parts" which should be handled as a unit (such as a city-state-ZIP combination within the US).
"""
type FedexAddress {
  """
  This is the combination of number, street name, etc. Note: At least one line is required and streetlines more than 3 will be ignored. Empty lines should not be included. Maximum length per line is 35. Example: [10 FedEx…
  """
  streetLines: [String]

  """
  This is a placeholder for City Name. Note: This is conditional and not required in all the requests. Note: It is recommended for Express shipments for the most accurate ODA and OPA surcharges. Example: Beverly Hills
  """
  city: String

  """
  This is a placeholder for State or Province code.State code is required for US, CA, PR and not required for other countries. Conditional. Example: CA click here to see State or Province Code
  """
  stateOrProvinceCode: String

  """
  Indicate the Postal code. This is Optional for non postal-aware countries. Maximum length is 10. Example: 65247 click here to see Postal aware countries
  """
  postalCode: String

  """
  This is the two-letter country code. Maximum length is 2. Example: US click here to see Country codes
  """
  countryCode: String

  """
  Indicate whether this address is residential (as opposed to commercial).
  """
  residential: Boolean
}

